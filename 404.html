
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — You've Found the Old Fruit Stand</title>
  <meta name="description" content="This page has moved. Visit the new Fruit Stand Productions website.">

  <meta name="theme-color" content="#100608">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      background: linear-gradient(-45deg, #100608, #26090f, #12070b, #350b15);
      background-size: 400% 400%;
      animation: gradientMove 16s ease infinite;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -50%;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(160, 20, 50, .17), transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(100, 10, 30, .2), transparent 55%);
      filter: blur(35px);
      animation: fogMove 20s ease-in-out infinite alternate;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 620px;
      padding: 55px 35px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 22px;
      background: rgba(15, 5, 9, .72);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 80px rgba(0, 0, 0, .45);
      animation: softPulse 6s ease-in-out infinite;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 18px;
      margin-bottom: 28px;
    }

    .error {
      color: #e35b72;
      font-size: 14px;
      letter-spacing: 5px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(38px, 8vw, 64px);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 22px;
    }

    p {
      color: #c9bfc2;
      font-size: 16px;
      line-height: 1.7;
      margin: 0 auto 16px;
      max-width: 440px;
    }

    .button {
      display: inline-block;
      margin-top: 22px;
      padding: 15px 30px;
      border-radius: 50px;
      background: #b51f3c;
      color: white;
      text-decoration: none;
      font-weight: bold;
      letter-spacing: 1px;
      transition: .25s ease;
    }

    .button:hover {
      background: #e02c50;
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(210, 30, 70, .3);
    }

    footer {
      margin-top: 38px;
      color: #786b70;
      font-size: 11px;
      letter-spacing: 2px;
    }

    @keyframes gradientMove {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes fogMove {
      from { transform: translate(-3%, -2%); }
      to { transform: translate(3%, 2%); }
    }

    @keyframes softPulse {
      0%, 100% { box-shadow: 0 20px 80px rgba(0, 0, 0, .45); }
      50% { box-shadow: 0 20px 90px rgba(120, 15, 40, .18); }
    }

    @media (max-width: 480px) {
      .card { padding: 42px 23px; }
      p { font-size: 15px; }
    }
  </style>
</head>

<body>
  <main class="card">
    <img
      class="logo"
      src="https://fruitstandproductions.github.io/FruitStandProductions/assets/Fspprofile.JPG"
      alt="Fruit Stand Productions"
    >

    <div class="error">ERROR 404</div>

    <h1>LOST YOUR WAY?</h1>

    <p>
      This page is part of the old Fruit Stand Productions website.
      We've moved on to something bigger.
    </p>

    <p>
      The old site has been retired. Our new home is waiting for you.
    </p>

    <a
      class="button"
      href="https://fruitstandproductions.pages.dev/"
    >
      VISIT THE NEW WEBSITE →
    </a>

    <footer>
      FRUIT STAND PRODUCTIONS · NEW HOME, SAME FRUIT.
    </footer>
  </main>
</body>
</html>
